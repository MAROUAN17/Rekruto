<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>[NAME] - Cover Letter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Calibri,Arial,sans-serif;line-height:1.6;color:#000;background:#f5f5f5}
.cover-letter{max-width:8.5in;margin:5px auto;padding:.4in;background:#fff}
.header{margin-bottom:14px;border-bottom:1px solid #000}
.sender-info,.recipient-info,.salutation,.body-content,.closing,.signature{font-size:11px}
.sender-info,.recipient-info{line-height:1.4;margin-bottom:14px}
.recipient-info div{margin-bottom:2px}
.salutation{margin-bottom:16px}
.body-content{text-align:justify}
.body-content p{margin-bottom:8px}
.closing{margin-top:16px;margin-bottom:20px}
@media print{body{background:#fff}.cover-letter{margin:0;padding:.4in}}
</style>
</head>
<body>
<div class="cover-letter">
<div class="header">
<div class="sender-info">
<div><strong>[NAME]</strong></div>
<div>[PHONE]</div>
<div>[EMAIL]</div>
</div>
<div class="recipient-info">
<div>[HIRING_MANAGER_NAME]</div>
<div>[HIRING_MANAGER_TITLE]</div>
<div>[COMPANY_NAME]</div>
<div>[COMPANY_ADDRESS]</div>
<div>[CITY], [STATE] [ZIP]</div>
</div>
</div>
<div class="salutation">Dear [HIRING_MANAGER_OR_TEAM]:</div>
<div class="body-content">
<p>[OPENING_PARA]</p>
<p>[BODY_PARA_1]</p>
<p>[BODY_PARA_2]</p>
<p>[BODY_PARA_3]</p>
<p>[CLOSING_PARA]</p>
</div>
<div class="closing">Sincerely,</div>
<div class="signature">[NAME]</div>
</div>
</body>
</html>
